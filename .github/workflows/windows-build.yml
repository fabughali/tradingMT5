name: Windows build

# Builds the Windows GUI + engine binaries on every push to main and on
# manual trigger (2026-10-07, Windows port) - the app has never targeted
# Windows before, so this workflow generates the `windows/` platform
# scaffold itself via `flutter create` (step below) rather than relying on
# one committed to the repo - that only works correctly when generated BY
# Flutter tooling ON Windows (the capability check that decides whether to
# write those files is gated on the host platform, so it can't be
# generated on the Linux dev machine this app is otherwise built on).
#
# Also publishes a versioned GitHub Release on every run (2026-10-07, per
# the user: "any fix you do now you should make sure that exe windows file
# has it") - tagged from pubspec.yaml's own version, so the download is a
# permanent, clearly-versioned link instead of a 30-day Actions artifact
# that doesn't say which fixes it includes.
#
# Publishes a real installer, not just a zip (2026-10-09, per the user: "i
# am not looking for exe direct run file. i want a setup exe file where it
# setup all and everything on windows") - compiles windows_installer\
# tradingmt5.iss (Inno Setup) into TradingMT5-Setup-<version>.exe, which
# installs to a per-user folder, creates Start Menu/Desktop shortcuts, and
# registers a normal Windows uninstaller - no manual unzip-and-run-the-bare-
# exe step left for the user. The raw zip is still published alongside it
# for anyone who genuinely wants a portable, no-install copy, but the
# installer is the primary, recommended download (see WINDOWS.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform scaffold
        # Idempotent - fills in only what's missing (the windows/ folder),
        # never touches lib/ or anything else already in the repo.
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version%+*}" >> "$GITHUB_OUTPUT"

      - name: Build GUI (release)
        run: flutter build windows --release

      - name: Build engine (release)
        run: dart compile exe bin\engine.dart -o build\windows\x64\runner\Release\tradingmt5_engine.exe

      - name: Package release folder (portable zip)
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingMT5-Windows-${{ steps.version.outputs.full }}.zip

      # windows-latest doesn't ship Inno Setup pre-installed on every image
      # generation - installing it explicitly via Chocolatey (already on
      # every windows-latest runner) is reliable regardless of image
      # version, rather than hoping ISCC.exe happens to already be there.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 2026-10-09, per the user's real first-install error ("MSVCP140.dll
      # was not found" / "VCRUNTIME140_1.dll was not found") - Flutter's
      # Windows build links against the VC++ runtime but doesn't bundle its
      # DLLs. Present on this build machine (so the build itself succeeds
      # and nothing catches this in CI) but not guaranteed on a real end
      # user's Windows install. Downloaded fresh every run from Microsoft's
      # own stable aka.ms redirect (never committed to the repo - it's a
      # multi-MB Microsoft-owned binary, not something this project ships
      # a stale copy of) into windows_installer\, where tradingmt5.iss's
      # own [Files] entry expects to find it.
      - name: Download VC++ Redistributable
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile windows_installer\vc_redist.x64.exe

      - name: Build Windows installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.full }} windows_installer\tradingmt5.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TradingMT5-Setup-${{ steps.version.outputs.full }}
          path: installer_output\TradingMT5-Setup-${{ steps.version.outputs.full }}.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: TradingMT5-Windows-${{ steps.version.outputs.full }}
          path: TradingMT5-Windows-${{ steps.version.outputs.full }}.zip
          retention-days: 30

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            installer_output\TradingMT5-Setup-${{ steps.version.outputs.full }}.exe
            TradingMT5-Windows-${{ steps.version.outputs.full }}.zip
          # Same tag pushed again (another fix at the same pubspec version)
          # updates the existing release's assets instead of failing.
          make_latest: true
