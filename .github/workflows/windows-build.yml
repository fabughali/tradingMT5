name: Windows build

# Builds the Windows GUI + engine binaries on every push to main and on
# manual trigger (2026-10-07, Windows port) - the app has never targeted
# Windows before, so this workflow generates the `windows/` platform
# scaffold itself via `flutter create` (step below) rather than relying on
# one committed to the repo - that only works correctly when generated BY
# Flutter tooling ON Windows (the capability check that decides whether to
# write those files is gated on the host platform, so it can't be
# generated on the Linux dev machine this app is otherwise built on).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform scaffold
        # Idempotent - fills in only what's missing (the windows/ folder),
        # never touches lib/ or anything else already in the repo.
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build GUI (release)
        run: flutter build windows --release

      - name: Build engine (release)
        run: dart compile exe bin\engine.dart -o build\windows\x64\runner\Release\tradingmt5_engine.exe

      - name: Package release folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingMT5-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TradingMT5-Windows
          path: TradingMT5-Windows.zip
          retention-days: 30
