name: trading_mt5
description: "TradingMT5: deterministic MT5-broker grid/signal trading engine (Flutter/Dart), standalone with TradingView and MetaTrader 5"
publish_to: 'none'

version: 1.2.10+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.7
  intl: ^0.20.2
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  archive: ^4.3.0
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - pubspec.yaml
    - assets/logo.png
    - assets/icons/icon_16.png
    - assets/icons/icon_32.png
    - assets/icons/icon_48.png
    - assets/icons/icon_64.png
    - assets/icons/icon_128.png
    - assets/icons/icon_256.png
    - assets/icons/icon_512.png
